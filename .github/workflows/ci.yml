name: Enterprise delivery

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-latest
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - id: matrix
        run: npx tsx build/ci-matrix.ts
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
  pruning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Verify all module combinations and negative pruning cases
        run: npm run test:pruning
  console:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:console
  delivery:
    needs: [profiles, checks, pruning]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.profiles.outputs.profiles) }}
        mode: [staging, production]
    env:
      APP_PROFILE: ${{ matrix.profile }}
      APP_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build -- --mode "$APP_MODE"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:delivery
      - name: Verify physical pruning evidence and final output bytes
        run: npm run pruning:verify -- --artifact "dist/$APP_PROFILE/$APP_MODE"
      - name: Verify current target module limits, pruning rules, and backend compatibility
        run: >-
          npm run release:verify -- --profile "$APP_PROFILE" --mode "$APP_MODE"
          --artifact "dist/$APP_PROFILE/$APP_MODE"
          --backend-policy "config/backend-policies/demo-$APP_PROFILE-$APP_MODE.json"
          --delivery-policy "config/delivery-policies/demo-$APP_PROFILE-$APP_MODE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ matrix.profile }}-${{ matrix.mode }}
          path: dist/${{ matrix.profile }}/${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 30
