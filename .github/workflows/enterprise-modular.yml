name: Enterprise modular architecture

on:
  push:
    paths: ['enterprise-modular/**', '.github/workflows/enterprise-modular.yml']
  pull_request:
    paths: ['enterprise-modular/**', '.github/workflows/enterprise-modular.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-modular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: enterprise-modular/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:console
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-modular-verification
          path: |
            enterprise-modular/.audit
            enterprise-modular/.artifacts
            enterprise-modular/playwright-report
          include-hidden-files: true
          retention-days: 14
