# Replace the target path with the dedicated directory passed to release:deploy.
# The example corresponds to enterprise-a / production only.
server {
    listen 8080;
    server_name _;
    root /srv/enterprise/enterprise-a-production/current;
    include /etc/nginx/mime.types;

    # A shared fingerprinted asset store retains both current and historical bytes.
    # Never fall back to index.html for an absent JS/CSS resource.
    location ^~ /assets/ {
        root /srv/enterprise/enterprise-a-production;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /release-record.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Deep links must reach the SPA so its common not-found/permission UI can run.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
