# Replace the target path with the dedicated directory passed to release:deploy.
# The example corresponds to enterprise-a / production only.
server {
    listen 8080;
    server_name _;
    root /srv/enterprise/enterprise-a-production/current/site;
    include /etc/nginx/mime.types;

    # One pointer selects the site and the current-policy-compliant asset set.
    # archives/, releases/, and old root assets/ remain private evidence.
    # Never fall back to index.html for an absent JS/CSS resource.
    location ^~ /assets/ {
        root /srv/enterprise/enterprise-a-production/current;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /release-record.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /pruning-report.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~ ^/(archives|releases|public-generations)(/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Deep links must reach the SPA so its common not-found/permission UI can run.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
